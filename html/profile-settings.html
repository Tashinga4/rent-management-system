  <script>
    const profileSettings = {
      profile: null,
      currentAvatarPath: null,

      async init() {
        await this.loadProfile();
        this.setupEventListeners();
      },

      async loadProfile() {
        try {
          const response = await api.getProfile();
          this.profile = response.data;
          this.populateForm();
        } catch (error) {
          console.error('Error loading profile:', error);
          alert('Failed to load profile data');
        }
      },

      populateForm() {
        document.getElementById('profileId').value = this.profile._id;
        document.getElementById('name').value = this.profile.name || '';
        document.getElementById('email').value = this.profile.email || '';
        document.getElementById('role').value = this.profile.role || '';
        document.getElementById('company').value = this.profile.company || '';
        document.getElementById('phone').value = this.profile.phone || '';
        document.getElementById('bio').value = this.profile.bio || '';
        
        this.currentAvatarPath = this.profile.avatar || '../assets/img/avatars/1.png';
        this.updateAvatarDisplay(this.currentAvatarPath);
      },

      updateAvatarDisplay(path) {
        document.getElementById('uploadedAvatar').src = path;
        document.getElementById('navbarAvatar').src = path;
        document.getElementById('dropdownAvatar').src = path;
      },

      setupEventListeners() {
        // File upload
        document.getElementById('upload').addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (file) {
            await this.uploadAvatar(file);
          }
        });

        // Reset avatar
        document.getElementById('resetAvatar').addEventListener('click', () => {
          this.currentAvatarPath = '../assets/img/avatars/1.png';
          this.updateAvatarDisplay(this.currentAvatarPath);
          document.getElementById('upload').value = '';
        });

        // Form submission
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          await this.saveProfile();
        });
      },

      async uploadAvatar(file) {
        try {
          const formData = new FormData();
          formData.append('avatar', file);
          
          const response = await api.uploadAvatar(formData);
          
          if (response.success) {
            this.currentAvatarPath = response.avatarPath;
            this.updateAvatarDisplay(this.currentAvatarPath);
            alert('Profile picture uploaded successfully!');
            
            // Automatically refresh profile data
            await this.loadProfile();
          } else {
            alert('Failed to upload profile picture: ' + response.error);
          }
        } catch (error) {
          console.error('Error uploading avatar:', error);
          alert('Failed to upload profile picture');
        }
      },

      async saveProfile() {
        try {
          const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            role: document.getElementById('role').value,
            company: document.getElementById('company').value,
            phone: document.getElementById('phone').value,
            bio: document.getElementById('bio').value,
            avatar: this.currentAvatarPath
          };

          const profileId = document.getElementById('profileId').value;
          const response = await api.updateProfile(profileId, formData);

          if (response.success) {
            alert('Profile updated successfully!');
            
            // Update navbar display
            document.getElementById('dropdownName').textContent = formData.name;
            document.getElementById('dropdownRole').textContent = formData.role;
            
            // Reload profile
            await this.loadProfile();
          } else {
            alert('Failed to update profile: ' + response.error);
          }
        } catch (error) {
          console.error('Error saving profile:', error);
          alert('Failed to save profile');
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      profileSettings.init();
    });
  </script>
