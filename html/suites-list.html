<!DOCTYPE html>
<html lang="en" class="light-style layout-menu-fixed" dir="ltr" data-assets-path="../assets/" data-template="vertical-menu-template-free">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Suite Management - RentMS</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/vendor/fonts/boxicons.css" />
  <link rel="stylesheet" href="../assets/vendor/css/core.css" class="template-customizer-core-css" />
  <link rel="stylesheet" href="../assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
  <link rel="stylesheet" href="../assets/css/demo.css" />
  <script src="../assets/vendor/js/helpers.js"></script>
  <script src="../assets/js/config.js"></script>
</head>
<body>
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
      <!-- Menu -->
      <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
        <div class="app-brand demo">
          <a href="index.html" class="app-brand-link">
            <span class="app-brand-text demo menu-text fw-bolder ms-2">RentMS</span>
          </a>
        </div>
        <div class="menu-inner-shadow"></div>
        <ul class="menu-inner py-1">
          <li class="menu-item">
            <a href="index.html" class="menu-link">
              <i class="menu-icon tf-icons bx bx-home-circle"></i>
              <div data-i18n="Dashboard">Dashboard</div>
            </a>
          </li>
          <li class="menu-item active open">
            <a href="javascript:void(0);" class="menu-link menu-toggle">
              <i class="menu-icon tf-icons bx bx-building"></i>
              <div data-i18n="Apartments">Apartments</div>
            </a>
            <ul class="menu-sub">
              <li class="menu-item">
                <a href="Apartments-list.html" class="menu-link">
                  <div data-i18n="All Apartments">All Apartments</div>
                </a>
              </li>
              <li class="menu-item active">
                <a href="suites-list.html" class="menu-link">
                  <div data-i18n="Suites">Suites</div>
                </a>
              </li>
              <li class="menu-item">
                <a href="Apartments-add.html" class="menu-link">
                  <div data-i18n="Add Apartment">Add Apartment</div>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </aside>
      <!-- / Menu -->

      <div class="layout-page">
        <div class="content-wrapper">
          <div class="container-xxl flex-grow-1 container-p-y">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="fw-bold">Suite Management</h4>
              <button type="button" class="btn btn-primary" onclick="window.location.href='suites-add.html'">
                <i class="bx bx-plus me-1"></i> Add Suite
              </button>
            </div>

            <!-- Filter by Apartment -->
            <div class="card mb-4">
              <div class="card-body">
                <div class="row">
                  <div class="col-md-4">
                    <label class="form-label">Filter by Apartment</label>
                    <select id="propertyFilter" class="form-select">
                      <option value="">All Apartments</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select id="statusFilter" class="form-select">
                      <option value="">All Status</option>
                      <option value="vacant">Vacant</option>
                      <option value="occupied">Occupied</option>
                      <option value="maintenance">Maintenance</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Search</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search suites...">
                  </div>
                </div>
              </div>
            </div>

            <!-- Suites Table -->
            <div class="card">
              <h5 class="card-header">All Suites</h5>
              <div class="table-responsive text-nowrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Suite Number</th>
                      <th>Apartment</th>
                      <th>Floor</th>
                      <th>Rooms</th>
                      <th>Rent</th>
                      <th>Status</th>
                      <th>Tenant</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="suitesTableBody">
                    <tr>
                      <td colspan="8" class="text-center">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                          <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Loading suites...</p>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/vendor/libs/jquery/jquery.js"></script>
  <script src="../assets/vendor/libs/popper/popper.js"></script>
  <script src="../assets/vendor/js/bootstrap.js"></script>
  <script src="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
  <script src="../assets/vendor/js/menu.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/api-service.js"></script>

  <script>
    const suitesList = {
      Apartments: [],
      suites: [],
      tenants: [],

      async init() {
        try {
          await this.loadData();
          this.renderSuites();
          this.setupFilters();
        } catch (error) {
          console.error('Error initializing suites list:', error);
          this.showError('Failed to load suites');
        }
      },

      async loadData() {
        const [propertiesRes, suitesRes, tenantsRes] = await Promise.all([
          api.getProperties(),
          api.getSuites(),
          api.getTenants()
        ]);
        
        this.Apartments = propertiesRes.data || [];
        this.suites = suitesRes.data || [];
        this.tenants = tenantsRes.data || [];
        
        this.populatePropertyFilter();
      },

      populatePropertyFilter() {
        const filter = document.getElementById('propertyFilter');
        filter.innerHTML = '<option value="">All Apartments</option>';
        
        this.Apartments.forEach(Apartment => {
          const option = document.createElement('option');
          option.value = Apartment._id;
          option.textContent = Apartment.name;
          filter.appendChild(option);
        });
      },

      renderSuites() {
        const tbody = document.getElementById('suitesTableBody');
        const propertyFilter = document.getElementById('propertyFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;
        const search = document.getElementById('searchInput').value.toLowerCase();

        let filteredSuites = this.suites.filter(suite => {
          const matchesProperty = !propertyFilter || suite.propertyId === propertyFilter;
          const matchesStatus = !statusFilter || suite.status === statusFilter;
          const matchesSearch = !search || 
            suite.suiteNumber.toLowerCase().includes(search) ||
            this.getPropertyName(suite.propertyId).toLowerCase().includes(search);
          
          return matchesProperty && matchesStatus && matchesSearch;
        });

        if (filteredSuites.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center">No suites found</td></tr>';
          return;
        }

        tbody.innerHTML = filteredSuites.map(suite => {
          const Apartment = this.Apartments.find(p => p._id === suite.propertyId);
          const propertyName = Apartment ? Apartment.name : 'Unknown';
          const tenant = this.tenants.find(t => t.suiteId === suite._id);
          const tenantName = tenant ? tenant.name : '-';
          
          const statusColor = {
            'vacant': 'secondary',
            'occupied': 'success',
            'maintenance': 'warning'
          }[suite.status] || 'secondary';

          return `
            <tr>
              <td><strong>${suite.suiteNumber}</strong></td>
              <td>${propertyName}</td>
              <td>${suite.floor || '-'}</td>
              <td>${suite.totalRooms || 0}</td>
              <td>$${parseFloat(suite.rentAmount || 0).toFixed(2)}</td>
              <td><span class="badge bg-label-${statusColor}">${suite.status}</span></td>
              <td>${tenantName}</td>
              <td>
                <div class="dropdown">
                  <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                    <i class="bx bx-dots-vertical-rounded"></i>
                  </button>
                  <div class="dropdown-menu">
                    <a class="dropdown-item" href="javascript:void(0);" onclick="suitesList.viewRooms('${suite._id}')">
                      <i class="bx bx-door-open me-1"></i> View Rooms
                    </a>
                    <a class="dropdown-item" href="suites-add.html?id=${suite._id}">
                      <i class="bx bx-edit-alt me-1"></i> Edit
                    </a>
                    <a class="dropdown-item" href="javascript:void(0);" onclick="suitesList.deleteSuite('${suite._id}', '${suite.suiteNumber}')">
                      <i class="bx bx-trash me-1"></i> Delete
                    </a>
                  </div>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      },

      getPropertyName(propertyId) {
        const Apartment = this.Apartments.find(p => p._id === propertyId);
        return Apartment ? Apartment.name : '';
      },

      setupFilters() {
        document.getElementById('propertyFilter').addEventListener('change', () => this.renderSuites());
        document.getElementById('statusFilter').addEventListener('change', () => this.renderSuites());
        document.getElementById('searchInput').addEventListener('input', () => this.renderSuites());
      },

      viewRooms(suiteId) {
        window.location.href = `rooms-list.html?suiteId=${suiteId}`;
      },

      async deleteSuite(id, suiteNumber) {
        if (!confirm(`Delete suite ${suiteNumber}? This action cannot be undone.`)) {
          return;
        }

        try {
          const response = await api.deleteSuite(id);
          if (response.success) {
            alert('Suite deleted successfully!');
            await this.init();
          } else {
            this.showError(response.error || 'Failed to delete suite');
          }
        } catch (error) {
          console.error('Error deleting suite:', error);
          this.showError('Failed to delete suite');
        }
      },

      showError(message) {
        alert(message);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      suitesList.init();
    });
  </script>
</body>
</html>
